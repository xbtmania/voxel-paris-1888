<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Voxel Paris 1888: a self-contained three.js voxel diorama of Paris in 1888, with the Eiffel Tower under construction.">
<meta name="theme-color" content="#171512">
<meta property="og:type" content="website">
<meta property="og:title" content="Voxel Paris 1888 — La Tour en Construction">
<meta property="og:description" content="A floating voxel Paris of 1888, with the Eiffel Tower under construction. A deterministic 14-second three.js animation.">
<title>Voxel Paris 1888 — La Tour en Construction</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171512; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: relative;
    width: min(1280px, 100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #caa483;
    box-shadow: 0 30px 100px rgba(0, 0, 0, 0.55);
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(18, 10, 5, 0.24) 100%);
  }
  .title {
    position: absolute;
    left: 30px;
    bottom: 24px;
    pointer-events: none;
    color: rgba(255, 242, 220, 0.78);
    text-shadow: 0 2px 12px rgba(43, 22, 8, 0.5);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 10px;
    line-height: 1.5;
  }
  .title strong {
    display: block;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 0.24em;
    color: rgba(255, 246, 231, 0.94);
  }
  #error {
    display: none;
    position: absolute;
    inset: 0;
    padding: 48px;
    color: #f1dfc9;
    background: #1d1915;
    font: 14px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="1280" height="720" aria-label="A floating voxel diorama of Paris in 1888 with the Eiffel Tower under construction"></canvas>
  <div class="vignette"></div>
  <div class="title"><strong>Paris · 1888</strong>La Tour en construction — Champ de Mars</div>
  <div id="error"></div>
</div>
<script>
/*__THREE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
